services:
  puppyping:
    image: ${PUPPYPING_IMAGE:-ghcr.io/badbayesian/puppy_ping:main}
    pull_policy: always
    container_name: puppyping-scraper
    environment:
      TZ: America/Chicago
      PUPSWIPE_SCRAPER_ENABLED: ${PUPSWIPE_SCRAPER_ENABLED:-true}

      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAILS_TO: ${EMAILS_TO}

      # Database connection (internal docker network)
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
    volumes:
      - /mnt/thebutler/config/puppy_ping/cache:/app/.cache
    depends_on:
      - postgres
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    networks:
      - puppyping_net

  postgres:
    image: postgres:18
    container_name: puppyping-postgres
    environment:
      TZ: America/Chicago
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}

      # CRITICAL: force writable, standard data directory
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    networks:
      - puppyping_net

  postgres-backup:
    image: postgres:18
    container_name: puppyping-postgres-backup
    environment:
      TZ: America/Chicago
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      BACKUP_DIR: /backups
      BACKUP_HOUR: ${POSTGRES_BACKUP_HOUR:-1}
      BACKUP_MINUTE: ${POSTGRES_BACKUP_MINUTE:-30}
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-30}
      BACKUP_ON_STARTUP: ${POSTGRES_BACKUP_ON_STARTUP:-false}
    volumes:
      - ${POSTGRES_BACKUP_DIR:-/mnt/thebutler/config/puppy_ping/postgres/backups}:/backups
      - ./docker/run_postgres_backup.sh:/usr/local/bin/run_postgres_backup.sh:ro
    entrypoint:
      - sh
      - /usr/local/bin/run_postgres_backup.sh
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    networks:
      - puppyping_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: puppyping-pgadmin
    profiles:
      - debug
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "${PGADMIN_BIND_IP:-127.0.0.1}:5050:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - puppyping_net

  pupswipe:
    image: ${PUPPYPING_IMAGE:-ghcr.io/badbayesian/puppy_ping:main}
    pull_policy: always
    container_name: puppyping-pupswipe
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    environment:
      TZ: America/Chicago
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PUPSWIPE_SOURCES: ${PUPSWIPE_SOURCES:-paws_chicago,wright_way,anti_cruelty}
      PUPSWIPE_SESSION_SECRET: ${PUPSWIPE_SESSION_SECRET:-}
      PUPSWIPE_PUBLIC_URL: ${PUPSWIPE_PUBLIC_URL:-}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
    command:
      - python
      - -m
      - puppyping.pupswipe.server
      - --host
      - 0.0.0.0
      - --port
      - "${PUPSWIPE_PORT:-8010}"
    ports:
      - "${PUPSWIPE_BIND_IP:-127.0.0.1}:${PUPSWIPE_PORT:-8010}:${PUPSWIPE_PORT:-8010}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PUPSWIPE_PORT:-8010}/api/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    networks:
      - puppyping_net


networks:
  puppyping_net:
    name: ${PUPPYPING_NETWORK_NAME:-puppyping_net}

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-puppyping_postgres_data}
  pgadmin_data:
    name: ${PGADMIN_VOLUME_NAME:-puppyping_pgadmin_data}